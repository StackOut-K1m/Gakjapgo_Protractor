# Datadog 모니터링 오버레이.
#
# 운영 docker-compose.yml 은 이 저장소에 없고 인프라 담당이 서버에서 따로 관리한다.
# 그래서 에이전트 정의를 여기 별도 파일로 두고, 배포 시 겹쳐서 올린다:
#
#   docker compose -f docker-compose.yml -f docker-compose.datadog.yml up -d
#
# 서버의 .env 에 DD_API_KEY 를 넣어야 한다 (.gitignore 로 커밋은 막혀 있다):
#   DD_API_KEY=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
#
# 주의: 아래 backend 서비스 이름이 운영 compose 의 이름과 같아야 병합된다. 다르면 맞춰서 고친다.

services:
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: dd-agent
    # 호스트 프로세스/컨트롤그룹을 봐야 CPU·메모리를 컨테이너 단위로 쪼갤 수 있다.
    pid: host
    cgroup: host
    environment:
      DD_API_KEY: ${DD_API_KEY}
      # 가입한 리전과 반드시 일치해야 한다. 틀리면 인증이 조용히 실패한다.
      DD_SITE: ${DD_SITE:-ap1.datadoghq.com}
      DD_HOSTNAME: protractor-ec2
      DD_TAGS: 'env:prod project:protractor'

      # APM. NON_LOCAL_TRAFFIC 를 켜지 않으면 backend 컨테이너가 보낸 트레이스를
      # 에이전트가 전부 버린다 (가장 흔한 실패 원인).
      DD_APM_ENABLED: 'true'
      DD_APM_NON_LOCAL_TRAFFIC: 'true'

      # 모든 컨테이너의 stdout 을 로그로 수집한다.
      DD_LOGS_ENABLED: 'true'
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: 'true'
      DD_CONTAINER_EXCLUDE: 'name:dd-agent'

      DD_PROCESS_AGENT_ENABLED: 'true'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      # 컨테이너 stdout 로그 파일 실체가 여기 있다. 로그 수집에 필요하다.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    restart: unless-stopped
    # 트레이스 수신 포트(8126)는 호스트로 노출하지 않는다. 같은 compose 네트워크 안에서
    # datadog-agent:8126 으로 닿고, 열어두면 외부에서 임의 데이터를 밀어넣을 수 있다.

  backend:
    environment:
      # Dockerfile 의 JAVA_OPTS 가 이미 -javaagent 로 트레이서를 붙여 둔다.
      # 여기 값들은 "어디로 보낼지"와 "어떤 이름으로 보일지"만 정한다.
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: '8126'
      DD_SERVICE: protractor-backend
      DD_ENV: prod
      DD_VERSION: 0.0.1
      # 로그 줄에 trace_id 를 넣어 로그↔트레이스를 연결한다.
      DD_LOGS_INJECTION: 'true'
      # 트래픽이 적으니 100% 수집한다. 부하가 늘면 낮춘다.
      DD_TRACE_SAMPLE_RATE: '1'
