plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.6'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.protractor'
version = '0.0.1-SNAPSHOT'

springBoot {
    mainClass = 'com.protractor.backend.BackendApplication'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// @PathVariable Long sessionId 처럼 이름을 생략한 파라미터를 Spring이 바인딩하려면
// 컴파일된 클래스에 파라미터 이름이 남아 있어야 한다. Boot 플러그인이 자동으로 넣어주지만,
// IDE가 Gradle을 거치지 않고 자체 컴파일러로 빌드하면 빠져서 런타임에 터진다. 그래서 명시한다.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Docker healthcheck와 /actuator/health 상태 확인을 위해 사용합니다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 프로젝트 기능 구현이 시작되면 아래 의존성을 순서대로 추가합니다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 스터디룸 실시간(채팅·참여자 상태·타이머 페이즈)용 WebSocket(STOMP).
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    // refresh token 저장소로 Redis를 사용한다 (RefreshTokenRepository).
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 비밀번호 찾기 임시 비밀번호 메일 발송 (Gmail SMTP)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // JWT 발급/검증 (JwtTokenProvider)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 화상/음성(WebRTC) — OpenVidu 서버에 세션 생성·토큰 발급용 클라이언트.
    // 버전은 실행 중인 openvidu 컨테이너와 맞춰야 함(openvidu-dev). 불일치 시 이 숫자만 조정.
    implementation 'io.openvidu:openvidu-java-client:2.31.0'

    // 주간 AI 리포트 PDF 생성 — 차트 PNG(JFreeChart), LLM 소견 마크다운→HTML(commonmark, 표 확장),
    // HTML→PDF 렌더(openhtmltopdf, 한글 TTF 임베드)
    implementation 'org.jfree:jfreechart:1.5.5'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'

    // 리포트 PDF 를 S3 에 보관한다. 버킷 설정이 비어 있으면 이 의존성을 쓰지 않고 로컬 디스크로 동작한다
    // (ReportStorageConfig 참고). 자격증명은 기본 제공자 체인(환경변수·IAM 역할 등)에서 찾는다.
    implementation platform('software.amazon.awssdk:bom:2.28.16')
    implementation 'software.amazon.awssdk:s3'

    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
