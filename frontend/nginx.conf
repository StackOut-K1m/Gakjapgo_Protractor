server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API 요청은 백엔드 컨테이너로 프록시한다.
  # 프론트는 /api/v1/... 로 호출하고, 여기서 그대로 backend:8080/api/v1/... 로 전달된다.
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # WebSocket(STOMP) 연결. 아래 SPA 폴백보다 먼저 잡아야 index.html이 내려가지 않는다.
  # Upgrade/Connection 헤더를 넘기지 않으면 핸드셰이크가 일반 HTTP 200으로 끝나 연결이 안 된다.
  location /ws {
    proxy_pass http://backend:8080/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 공부 중에는 연결이 오래 열려 있다. 기본 60초면 조용할 때 끊긴다.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # SPA 라우팅: 실제 파일이 없으면 index.html로 폴백(React Router 새로고침 대응).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
