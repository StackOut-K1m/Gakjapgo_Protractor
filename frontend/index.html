<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>각잡고</title>
    <!--
      숫자 Archivo Black / 수치·코드 JetBrains Mono.
      본문 한글은 자연산스이고, 그쪽은 index.css 의 @font-face 가 받아 온다.
      CSS 안에서 @import 하면 스타일시트를 다 받은 뒤에야 폰트 요청이 시작돼서,
      여기서 미리 연결해 두고 같이 받는다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 자연산스가 올라와 있는 CDN. 연결을 미리 터 두면 본문 폰트가 그만큼 빨리 바뀐다 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500&display=swap"
    />
    <!-- GA4 -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X7B3T348N6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-X7B3T348N6');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
