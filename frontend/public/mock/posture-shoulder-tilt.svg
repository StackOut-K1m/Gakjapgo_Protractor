<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="어깨 기울어짐 예시 이미지">
  <defs>
    <linearGradient id="bg-shoulder-tilt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFEAD5"/>
      <stop offset="1" stop-color="#FEC84B"/>
    </linearGradient>
  </defs>

  <rect width="640" height="220" fill="url(#bg-shoulder-tilt)"/>

  <!-- 정면 시점: 어깨가 있어야 할 수평 기준선 -->
  <line x1="196" y1="120" x2="452" y2="120" stroke="#93370D" stroke-width="2" stroke-dasharray="6 7" opacity="0.4"/>
  <text x="460" y="125" font-family="'Noto Sans KR', sans-serif" font-size="13" fill="#93370D" opacity="0.65">수평</text>

  <!-- 몸통 (기울어진 어깨선을 따라 함께 기울었다) -->
  <path d="M244 142 L400 116 L388 200 L256 200 Z" fill="#93370D" opacity="0.9"/>

  <!-- 팔 -->
  <g stroke="#93370D" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M236 136 L214 194"/>
    <path d="M408 110 L430 178"/>
    <!-- 기울어진 어깨선 -->
    <path d="M236 136 L408 110"/>
    <!-- 목 -->
    <path d="M322 92 L322 122"/>
  </g>
  <circle cx="322" cy="62" r="30" fill="#93370D"/>

  <!-- 기울기 표시 -->
  <path d="M384 120 A 64 64 0 0 0 382 111" fill="none" stroke="#B54708" stroke-width="2.5"/>
  <text x="374" y="104" font-family="'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#B54708">9°</text>

  <text x="20" y="204" font-family="'Noto Sans KR', sans-serif" font-size="13" fill="#93370D" opacity="0.65">예시 이미지</text>
</svg>
