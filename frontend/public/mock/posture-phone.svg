<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="휴대폰 사용 예시 이미지">
  <defs>
    <linearGradient id="bg-phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>

  <rect width="640" height="220" fill="url(#bg-phone)"/>

  <!-- 책상과 모니터 (방치된 상태) -->
  <rect x="400" y="150" width="224" height="7" rx="3.5" fill="#075985" opacity="0.2"/>
  <rect x="452" y="64" width="126" height="74" rx="6" fill="#ffffff" opacity="0.6"/>
  <rect x="507" y="138" width="16" height="12" fill="#ffffff" opacity="0.6"/>

  <!-- 고개를 숙이고 휴대폰을 보는 옆모습 -->
  <g stroke="#075985" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M244 196 L244 130"/>
    <path d="M244 130 C 246 112, 254 100, 268 92"/>
    <path d="M250 138 L302 158"/>
  </g>
  <circle cx="284" cy="80" r="27" fill="#075985"/>

  <!-- 손에 들린 휴대폰 + 화면 불빛 -->
  <g transform="rotate(-18 318 140)">
    <rect x="302" y="112" width="32" height="56" rx="6" fill="#0C4A6E"/>
    <rect x="306" y="118" width="24" height="44" rx="3" fill="#7DD3FC"/>
  </g>
  <path d="M312 106 L296 92 M330 104 L340 88 M322 100 L324 82" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <text x="20" y="204" font-family="'Noto Sans KR', sans-serif" font-size="13" fill="#075985" opacity="0.6">예시 이미지</text>
</svg>
