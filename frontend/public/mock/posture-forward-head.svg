<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="거북목 자세 예시 이미지">
  <defs>
    <linearGradient id="bg-forward-head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FEE4E2"/>
      <stop offset="1" stop-color="#FECDCA"/>
    </linearGradient>
  </defs>

  <rect width="640" height="220" fill="url(#bg-forward-head)"/>

  <!-- 책상과 모니터 -->
  <rect x="372" y="140" width="252" height="7" rx="3.5" fill="#8c1d18" opacity="0.2"/>
  <rect x="432" y="44" width="130" height="78" rx="6" fill="#ffffff" opacity="0.7"/>
  <rect x="489" y="122" width="16" height="18" fill="#ffffff" opacity="0.7"/>

  <!-- 원래 있어야 할 수직 기준선 -->
  <line x1="250" y1="20" x2="250" y2="198" stroke="#8c1d18" stroke-width="2" stroke-dasharray="6 7" opacity="0.35"/>

  <!-- 기준선에서 앞으로 꺾여나간 목선 -->
  <line x1="250" y1="104" x2="292" y2="52" stroke="#F04438" stroke-width="2" stroke-dasharray="4 5" opacity="0.85"/>
  <path d="M250 60 A 44 44 0 0 1 268 67" fill="none" stroke="#F04438" stroke-width="2" opacity="0.85"/>
  <text x="258" y="42" font-family="'Noto Sans KR', sans-serif" font-size="15" font-weight="700" fill="#B42318">15°</text>

  <!-- 앉은 옆모습: 등이 말리고 머리가 앞으로 나와 있다 -->
  <g stroke="#8c1d18" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M250 152 C 248 118, 258 94, 282 82"/>
    <path d="M250 152 L330 155"/>
    <path d="M330 155 L333 196"/>
    <path d="M266 114 L326 133"/>
  </g>
  <circle cx="296" cy="72" r="26" fill="#8c1d18"/>

  <text x="20" y="204" font-family="'Noto Sans KR', sans-serif" font-size="13" fill="#8c1d18" opacity="0.55">예시 이미지</text>
</svg>
