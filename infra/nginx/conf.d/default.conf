# WebSocket Connection 헤더 제어 (요청에 Upgrade 있을 때만 upgrade)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP(80) -> HTTPS(443) 리다이렉트
server {
    listen 80;
    server_name i15c106.p.ssafy.io;
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS(443)
server {
    listen 443 ssl;
    http2 on;
    server_name i15c106.p.ssafy.io;

    # SSAFY 와일드카드 인증서 (기존 경로 유지)
    ssl_certificate     /etc/letsencrypt/live/p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p.ssafy.io/privkey.pem;

    # 도커 내장 DNS로 업스트림을 런타임 해석 (컨테이너 늦게 떠도/재배포로 IP 바뀌어도 안전)
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 60m;

    # 1. OpenVidu 서버 API + WebSocket (기존 유지)
    # OpenVidu WebSocket RPC 엔드포인트 (슬래시 없는 정확 매칭)
    location = /openvidu {
        set $ov openvidu:4443;
        proxy_pass http://$ov;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openvidu/ {
        set $ov openvidu:4443;
        proxy_pass http://$ov;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenVidu Dashboard (기존 유지)
    location /dashboard/ {
        set $ov openvidu:4443;
        proxy_pass http://$ov;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. 백엔드 (Spring Boot) — /api/v1... 경로를 그대로 보존 (끝 슬래시 없음!)
    # 백엔드 STOMP WebSocket (/ws) — 실시간 참여자/채팅
    location /ws {
        set $wsbackend backend:8080;
        proxy_pass http://$wsbackend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        set $backend backend:8080;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 3. 프론트엔드 (React SPA) — 그 외 전부
    location / {
        set $frontend frontend:80;
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
